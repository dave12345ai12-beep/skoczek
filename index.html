<meta name="theme-color" content="#100e1c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Skoczek">

<title>Skoczek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: one-screen game cabinet — HUD strip, HD canvas stage, touch pad on phones. Single dark look by choice. */
:root{
  --ink:#100e1c; --panel:#1d1930; --panel2:#272240; --line:#3b3458; --paper:#f6efdc; --muted:#b4abcb;
  --leaf:#7fd25a; --leafdark:#2f6a22; --gold:#f5c430; --berry:#ef5a45;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --mono:"Press Start 2P", ui-monospace, "Courier New", monospace;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:radial-gradient(120% 80% at 50% 0%,#1e1a36 0%,var(--ink) 60%);background-color:var(--ink);color:var(--paper);font-family:var(--display);font-size:16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;max-width:1400px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hud-l{display:flex;align-items:baseline;gap:10px;min-width:0}
.lvl{font-family:var(--mono);font-size:10px;color:var(--gold)}
.lvlname{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-stats{display:flex;gap:8px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px 3px 7px;font-weight:700;font-size:15px}
.stat small{font-family:var(--mono);font-size:7px;color:var(--muted);letter-spacing:.06em}
.ico{display:inline-block;width:14px;height:14px}
.ico.coin{border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0 0 18%,#f5c430 45%,#c47f12 100%)}
.ico.heart{background:linear-gradient(#ff7d8e,#e0344c);clip-path:path("M7 13 C2 9 0 6.5 0 4 C0 1.5 2 0 3.8 0 C5.3 0 6.4 .9 7 2 C7.6 .9 8.7 0 10.2 0 C12 0 14 1.5 14 4 C14 6.5 12 9 7 13Z")}
.hud-r{display:flex;gap:6px}
.hud-r button{width:36px;height:32px;background:var(--panel);border:1px solid var(--line);font-family:var(--mono);font-size:9px;border-radius:10px}
.hud-r button[aria-pressed="true"]{color:var(--muted);text-decoration:line-through}

.stage{flex:1;min-height:0;position:relative;display:grid;place-items:center}
canvas#cv{display:block;border-radius:14px;background:#000;max-width:100%;box-shadow:0 0 0 1px #3b3458,0 18px 50px -12px rgba(0,0,0,.8)}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:12px;background:radial-gradient(closest-side,rgba(10,8,22,.25),rgba(10,8,22,.6))}
.card{width:min(580px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,rgba(39,34,64,.96),rgba(29,25,48,.96));border:1px solid var(--line);box-shadow:0 24px 60px -18px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.06);border-radius:18px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;backdrop-filter:blur(6px)}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,64px);line-height:.9;margin:0;color:var(--leaf);letter-spacing:.01em;
  text-shadow:0 3px 0 var(--leafdark),0 6px 0 #1b3d14,0 12px 22px rgba(0,0,0,.5)}
h2{font-weight:800;font-size:28px;line-height:1.1;margin:0;color:var(--gold);text-wrap:balance}
.tag,.card p{margin:0;line-height:1.35;color:var(--paper);max-width:60ch;font-size:17px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.lv{display:flex;align-items:center;gap:12px;text-align:left;padding:8px 12px 8px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;transition:border-color .15s,transform .15s}
.lv i{width:44px;height:34px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.lv b{font-family:var(--mono);font-size:9px;color:var(--gold)}
.lv span{display:flex;flex-direction:column;line-height:1.1;font-weight:700;font-size:16px;min-width:0}
.lv small{color:var(--muted);font-size:13px;font-weight:500}
.lv:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.lv:disabled{opacity:.42;cursor:not-allowed}
.bestiary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.beast{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;font-size:13px;line-height:1.15;color:var(--muted)}
.beast canvas{width:56px;height:42px}
.beast strong{color:var(--paper);font-weight:700;font-size:15px}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:8px;padding:3px 5px;border:1px solid var(--line);border-bottom-width:3px;border-radius:5px;color:var(--paper);margin-right:3px;background:var(--panel)}
.best{font-size:15px;color:var(--muted)}
.best b{color:var(--gold);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 22px;justify-content:start;font-variant-numeric:tabular-nums;margin:0;font-size:17px}
.stats dt{color:var(--muted)} .stats dd{margin:0;color:var(--paper);font-weight:800}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font-weight:800;font-size:16px;padding:10px 18px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 0 #0b0916}
.btn.primary{background:linear-gradient(#93e06a,#5cb83c);color:#10240a;border-color:#2f6a22;box-shadow:0 4px 0 #2a5c1c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0b0916}

.pad{display:none;justify-content:space-between;align-items:center;gap:12px;touch-action:none}
.pad > div{display:flex;gap:10px}
.pad button{width:66px;height:58px;background:var(--panel);border:1px solid var(--line);border-radius:16px;font-size:20px;touch-action:none;box-shadow:0 4px 0 #0b0916}
.pad button.on{background:#3a3458;border-color:var(--gold);transform:translateY(2px);box-shadow:0 2px 0 #0b0916}
.pad .jump{width:100px;font-weight:800;font-size:17px;background:linear-gradient(#5aa83e,#3a7a28);border-color:#2a5c1c}
@media (pointer:coarse){.pad{display:flex}}
@media (max-width:540px){.hud-stats{gap:5px}.stat{padding:2px 8px 2px 5px;font-size:13px}.levels{grid-template-columns:repeat(2,minmax(0,1fr))}.lv i{width:30px;height:26px}.lv span{font-size:14px}.bestiary{grid-template-columns:repeat(3,minmax(0,1fr))}.lvlname{font-size:15px}}
@media (prefers-reduced-motion:reduce){.btn:active,.lv:hover:not(:disabled){transform:none}}
</style>
</head>

<div class="app">
  <header class="hud">
    <div class="hud-l"><span class="lvl" id="hudLevel">1/4</span><span class="lvlname" id="hudName">Polana</span></div>
    <div class="hud-stats">
      <span class="stat" title="Monety"><i class="ico coin"></i><b id="hudCoins">0</b></span>
      <span class="stat" title="Życia"><i class="ico heart"></i><b id="hudLives">5</b></span>
      <span class="stat"><small>PKT</small><b id="hudScore">000000</b></span>
      <span class="stat"><small>CZAS</small><b id="hudTime">300</b></span>
    </div>
    <div class="hud-r">
      <button id="btnMusic" aria-label="Wyłącz muzykę" aria-pressed="false">♫</button>
      <button id="btnMute" aria-label="Wycisz dźwięk" aria-pressed="false">♪</button>
      <button id="btnPause" aria-label="Pauza">II</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="cv" width="800" height="480"></canvas>

    <section class="overlay" id="ovMenu">
      <div class="card">
        <h1 class="logo">Skoczek</h1>
        <p class="tag">Żabka wyrusza przez dziesięć krain. Zbieraj monety, skacz wrogom na głowy, uważaj na lód, lawę i przepaście, i dotrzyj do flagi, zanim skończy się czas.</p>
        <div class="levels" id="levelList"></div>
        <div class="bestiary" id="bestiary"></div>
        <ul class="keys">
          <li><kbd>←</kbd><kbd>→</kbd>bieg</li>
          <li><kbd>Spacja</kbd>skok, przytrzymaj = wyżej</li>
          <li><kbd>↓</kbd>zeskok z deski</li>
          <li><kbd>P</kbd>pauza</li>
        </ul>
        <p class="best">Rekord: <b id="best">0</b></p>
      </div>
    </section>

    <section class="overlay" id="ovMsg" hidden>
      <div class="card">
        <h2 id="msgTitle"></h2>
        <p id="msgText"></p>
        <dl class="stats" id="msgStats"></dl>
        <div class="actions" id="msgActions"></div>
      </div>
    </section>
  </main>

  <div class="pad" id="pad">
    <div><button data-k="left" aria-label="W lewo">◀</button><button data-k="right" aria-label="W prawo">▶</button></div>
    <div><button data-k="down" aria-label="Zeskok">▼</button><button data-k="jump" class="jump">SKOK</button></div>
  </div>
</div>

/* ================= Physics ================= */
function moveX(e){
  e.x+=e.vx;e.hitWall=0;
  const r0=Math.floor(e.y/T),r1=Math.floor((e.y+e.h-0.01)/T);
  if(e.vx>0){const cx=Math.floor((e.x+e.w-0.01)/T);for(let cy=r0;cy<=r1;cy++)if(isSolid(cx,cy)){e.x=cx*T-e.w;e.vx=0;e.hitWall=1;break;}}
  else if(e.vx<0){const cx=Math.floor(e.x/T);for(let cy=r0;cy<=r1;cy++)if(isSolid(cx,cy)){e.x=(cx+1)*T;e.vx=0;e.hitWall=-1;break;}}
}
function moveY(e){
  const prevBottom=e.y+e.h;e.y+=e.vy;e.onGround=false;
  const c0=Math.floor(e.x/T),c1=Math.floor((e.x+e.w-0.01)/T);
  if(e.vy>0){const cy=Math.floor((e.y+e.h-0.01)/T);
    for(let cx=c0;cx<=c1;cx++){const c=tileAt(cx,cy);
      if(c==='#'||c==='='||(c==='-'&&prevBottom<=cy*T+0.5&&!(e.dropT>0))){e.y=cy*T-e.h;e.vy=0;e.onGround=true;break;}}}
  else if(e.vy<0){const cy=Math.floor(e.y/T);
    for(let cx=c0;cx<=c1;cx++){const c=tileAt(cx,cy);if(c==='#'||c==='='){e.y=(cy+1)*T;e.vy=0;break;}}}
}
const overlap=(a,b,inset=2)=>a.x+inset<b.x+b.w-inset&&a.x+a.w-inset>b.x+inset&&a.y+inset<b.y+b.h-inset&&a.y+a.h-inset>b.y+inset;
function floorBelow(x,y){const cx=Math.floor(x/T);for(let cy=Math.max(0,Math.floor(y/T));cy<L.H;cy++)if(isFloor(cx,cy))return cy*T;return null;}

/* ================= Audio & music ================= */
let AC=null,master=null,mBus=null,dSend=null,noiseBuf=null,bassF=null,muted=false,musicOn=true;
function ensureAudio(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();
      master=AC.createGain();master.gain.value=muted?0:1;master.connect(AC.destination);
      mBus=AC.createGain();mBus.gain.value=musicOn?.5:0;mBus.connect(master);
      const dl=AC.createDelay(1),fb=AC.createGain(),lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
      dSend=AC.createGain();dSend.gain.value=.2;dSend.connect(dl);dl.connect(lp);lp.connect(fb);fb.gain.value=.35;fb.connect(dl);lp.connect(mBus);dl.delayTime.value=.3;music.dl=dl;
      bassF=AC.createBiquadFilter();bassF.type='lowpass';bassF.frequency.value=900;bassF.connect(mBus);
      noiseBuf=AC.createBuffer(1,AC.sampleRate*.6|0,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }
    if(AC.state==='suspended')AC.resume();
    return true;
  }catch(e){return false;}
}
function tone(f1,f2,dur,type,vol,delay=0){
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,freq,vol){const t=AC.currentTime,n=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();n.buffer=noiseBuf;f.type='highpass';f.frequency.value=freq;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(f).connect(g).connect(master);n.start(t);n.stop(t+dur+.02);}
function sfx(n){
  if(muted||!ensureAudio())return;

  drawSky(th,ti,camX);drawLayers(ti,camX);
  ctx.setTransform(S,0,0,S,-camX*S,shy*S);
  if(L.chunks){const cw=CH*T,k0=Math.max(0,Math.floor(camX/cw)),k1=Math.min(L.chunks.length-1,Math.floor((camX+VW)/cw));
    for(let k=k0;k<=k1;k++)ctx.drawImage(L.chunks[k],k*cw,0,cw,VH);}
  for(const p of L.plats)if(p.x>camX-60&&p.x<camX+VW+10)drawPlat(p);
  for(const t of L.torches)if(t.x>camX-30&&t.x<camX+VW+30)drawTorch(t);
  for(const c of L.checks)drawCheck(c);
  if(L.flag)drawFlag(L.flag);
  for(const e of L.enemies)if(e.alive&&(e.type==='g'||e.type==='s'||e.type==='c')&&e.x>camX-30&&e.x<camX+VW+30)shadow(e.x+e.w/2,e.y+e.h,e.w*.55);
  if(P&&state!=='menu'&&state!=='dying'&&!P.plat)shadow(P.x+6,P.y+12,7);
  ctx.globalCompositeOperation='lighter';
  for(const c of L.coins)if(!c.taken&&c.x>camX-20&&c.x<camX+VW+20)glow(ctx,c.x,c.y,11,'255,215,90',.32);
  for(const h of L.items)if(!h.taken)glow(ctx,h.x,h.y,16,'255,110,140',.35);
  ctx.globalCompositeOperation='source-over';
  for(const c of L.coins)if(!c.taken&&c.x>camX-20&&c.x<camX+VW+20)drawCoin(c);
  for(const h of L.items)if(!h.taken)drawHeart(h);
  for(const e of L.enemies)if(e.type!=='f'&&e.x>camX-40&&e.x<camX+VW+40)drawEnemy(e);
  if(P&&state!=='menu')drawFrog();
  drawBlades(th);
  drawPits(th,ti);
  for(const e of L.enemies)if(e.type==='f'&&e.x>camX-40&&e.x<camX+VW+40)drawFireball(e);
  drawParticles();
  drawAmbient();
  drawLighting(th,camX);
  ctx.setTransform(1,0,0,1,0,0);
  if(vign)ctx.drawImage(vign,0,0);
  if(flash>.02){ctx.fillStyle=`rgba(255,60,70,${flash*.3})`;ctx.fillRect(0,0,cv.width,cv.height);}
}

/* ================= HUD & overlays ================= */
const $=id=>document.getElementById(id);
const hud={level:$('hudLevel'),name:$('hudName'),coins:$('hudCoins'),lives:$('hudLives'),score:$('hudScore'),time:$('hudTime')};
let hudCache='';
function updateHUD(force){
  if(!L)return;
  const total=L.coins.length,str=[levelIdx,levelCoins,lives,score,Math.ceil(time),state==='menu'].join('|');
  if(!force&&str===hudCache)return;hudCache=str;
  hud.level.textContent=(levelIdx+1)+'/'+LEVELS.length;hud.name.textContent=LEVELS[levelIdx].name;
  hud.coins.textContent=state==='menu'?'0':levelCoins+'/'+total;hud.lives.textContent=lives;
  hud.score.textContent=String(score).padStart(6,'0');hud.time.textContent=Math.ceil(time);
  hud.time.style.color=time<30&&state==='play'?'var(--berry)':'';
}
const ovMenu=$('ovMenu'),ovMsg=$('ovMsg');
function hideOverlays(){ovMenu.hidden=true;ovMsg.hidden=true;}
function showMsg({title,text,stats=[],actions}){
  $('msgTitle').textContent=title;$('msgText').textContent=text||'';$('msgText').hidden=!text;
  const dl=$('msgStats');dl.innerHTML='';dl.hidden=!stats.length;
  for(const [k,v] of stats){const dt=document.createElement('dt');dt.textContent=k;const dd=document.createElement('dd');dd.textContent=v;dl.append(dt,dd);}
  const box=$('msgActions');box.innerHTML='';
  actions.forEach(([label,act,primary])=>{const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=label;b.dataset.act=act;box.append(b);});
  ovMenu.hidden=true;ovMsg.hidden=false;
  const p=box.querySelector('.primary');if(p)p.focus({preventScroll:true});
}
function levelCleared(){
  stopSong();const bonus=Math.ceil(time)*5;score+=bonus;saveBest();
  if(levelIdx+2>unlocked&&levelIdx+1<LEVELS.length){unlocked=levelIdx+2;try{localStorage.setItem('skoczek.unlocked',unlocked);}catch(e){}}
  updateHUD(true);
  if(levelIdx===LEVELS.length-1){
    state='win';
    showMsg({title:'Wszystkie krainy przebyte!',text:'Skoczek przemierzył wszystkie dziesięć krain i dotarł ponad chmury. Brawo!',
      stats:[['Monety na poziomie',levelCoins+'/'+L.coins.length],['Bonus za czas','+'+bonus],['Wynik końcowy',score],['Rekord',best]],
      actions:[['Zagraj od nowa','restartAll',true],['Menu','menu']]});
  }else{
    state='cleared';
    showMsg({title:'Poziom ukończony!',text:'Następna kraina: '+LEVELS[levelIdx+1].name+'.',
      stats:[['Monety',levelCoins+'/'+L.coins.length],['Bonus za czas','+'+bonus],['Wynik',score],['Życia',lives]],
      actions:[['Dalej','next',true],['Menu','menu']]});
  }
}
function gameOver(){
  state='over';stopSong();saveBest();sfx('over');
  showMsg({title:'Koniec gry',text:'Skończyły się życia na poziomie „'+LEVELS[levelIdx].name+'”.',
    stats:[['Wynik',score],['Rekord',best]],actions:[['Spróbuj jeszcze raz','retry',true],['Menu','menu']]});
}
function pause(){
  if(state!=='play')return;state='paused';
  showMsg({title:'Pauza',actions:[['Graj dalej','resume',true],['Zacznij poziom od nowa','restartLevel'],['Menu','menu']]});
}
function resume(){if(state!=='paused')return;hideOverlays();state='play';}
function showMenu(){
  state='menu';levelIdx=0;L=loadLevel(0);if(AC)playSong(0);P=null;cam.x=0;particles=[];time=LEVEL_TIME;
  renderLevelList();$('best').textContent=best;ovMsg.hidden=true;ovMenu.hidden=false;updateHUD(true);
  const first=ovMenu.querySelector('.lv:not(:disabled)');if(first)first.focus({preventScroll:true});
}
function renderLevelList(){
  const box=$('levelList');box.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const b=document.createElement('button');b.className='lv';b.disabled=i>=unlocked;b.dataset.level=i;
    b.innerHTML='<i style="background:'+THEMES[lv.theme].chip+'"></i><span><b>KRAINA '+(i+1)+'</b>'+lv.name+'<small>'+(i<unlocked?(i===0?'start':'odblokowana'):'ukończ poprzednią')+'</small></span>';
    box.append(b);
  });
}
function renderBestiary(){
  const list=[['g','Grzyb','skacz na niego'],['s','Jeż','omijaj, kolce'],['b','Nietoperz','skacz na niego'],['w','Osa','skacz na nią'],['c','Krab','skacz na niego'],['f','Ognik','omijaj, wyskakuje z lawy']];
  const box=$('bestiary'),saved=ctx;
  for(const [type,name,hint] of list){
    const d=document.createElement('div');d.className='beast';
    const c=document.createElement('canvas');c.width=168;c.height=126;
    d.append(c);d.insertAdjacentHTML('beforeend','<strong>'+name+'</strong>'+hint);box.append(d);
    const g=c.getContext('2d');
    const e={type,x:0,y:0,w:12,h:12,vx:1,alive:true,ph:0,t:0};
    if(type==='s'){e.w=14;e.h=10;}if(type==='b'){e.w=14;e.h=8;}if(type==='w'){e.w=11;e.h=10;}if(type==='c'){e.w=14;e.h=10;}if(type==='f'){e.w=10;e.h=10;}
    e.x=14-e.w/2;e.y=type==='b'||type==='w'||type==='f'?9-e.h/2:19-e.h;
    ctx=g;g.setTransform(6,0,0,6,0,0);drawEnemy(e);ctx=saved;
  }
}
function act(a){
  if(a==='next')startLevel(levelIdx+1);
  else if(a==='retry')startGame(levelIdx);
  else if(a==='restartAll')startGame(0);
  else if(a==='menu')showMenu();
  else if(a==='resume')resume();
  else if(a==='restartLevel'){score=levelStartScore;startLevel(levelIdx);}
}
document.addEventListener('click',e=>{
  const lv=e.target.closest('.lv');if(lv&&!lv.disabled){sfx('coin');startGame(+lv.dataset.level);return;}
  const b=e.target.closest('[data-act]');if(b)act(b.dataset.act);
});
$('btnPause').addEventListener('click',e=>{e.currentTarget.blur();state==='play'?pause():resume();});
const muteBtn=$('btnMute');
function syncMute(){muteBtn.setAttribute('aria-pressed',muted?'true':'false');muteBtn.setAttribute('aria-label',muted?'Włącz dźwięk':'Wycisz dźwięk');}
muteBtn.addEventListener('click',()=>{muted=!muted;syncMute();if(master)master.gain.value=muted?0:1;try{localStorage.setItem('skoczek.muted',muted?'1':'0');}catch(e){}muteBtn.blur();});
syncMute();
const musicBtn=$('btnMusic');
function syncMusic(){musicBtn.setAttribute('aria-pressed',musicOn?'false':'true');musicBtn.setAttribute('aria-label',musicOn?'Wyłącz muzykę':'Włącz muzykę');if(mBus)mBus.gain.value=musicOn?.5:0;}
function wake(){if(!ensureAudio())return;if(state==='menu')playSong(0);else if(L&&state==='play')playSong(L.ti);}
musicBtn.addEventListener('click',()=>{musicOn=!musicOn;syncMusic();try{localStorage.setItem('skoczek.music',musicOn?'1':'0');}catch(e){}musicBtn.blur();if(musicOn)wake();});
syncMusic();
addEventListener('pointerdown',wake,true);addEventListener('keydown',wake,true);

/* ================= Input ================= */
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump',KeyZ:'jump',KeyK:'jump',ArrowDown:'down',KeyS:'down'};
function press(k,on){if(k==='jump'&&on&&!input.jump)input.jumpQueued=true;input[k]=on;}
addEventListener('keydown',e=>{
  if(e.code==='KeyP'||e.code==='Escape'){if(state==='play')pause();else if(state==='paused')resume();e.preventDefault();return;}
  const k=KEYMAP[e.code];
  if(k&&state==='play'){e.preventDefault();if(!e.repeat)press(k,true);else input[k]=true;}
  else if(k)input[k]=true;
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code];if(k)input[k]=false;});
addEventListener('blur',()=>{for(const k of['left','right','jump','down'])input[k]=false;if(state==='play')pause();});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  const down=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId);}catch(_){}press(k,true);b.classList.add('on');};
  const up=()=>{input[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',down);
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t,up));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});

/* ================= Sizing & loop ================= */
function resize(){
  const r=stage.getBoundingClientRect();if(!r.width||!r.height)return;
  VW=Math.round(Math.max(256,Math.min(480,VH*r.width/r.height)));
  const sc=Math.min((r.width-4)/VW,(r.height-4)/VH);
  const cssW=Math.floor(VW*sc),cssH=Math.floor(VH*sc);
  cv.style.width=cssW+'px';cv.style.height=cssH+'px';
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const ph=Math.min(1200,Math.max(240,Math.round(cssH*dpr)));
  S=ph/VH;cv.width=Math.round(VW*S);cv.height=ph;lc.width=cv.width;lc.height=cv.height;
  makeVignette();
  const nb=Math.min(3,Math.max(1,Math.ceil(S*2)/2));
  if(nb!==B){B=nb;bgCache={};if(L)bakeLevel(L);}
}
new ResizeObserver(resize).observe(stage);resize();
renderBestiary();showMenu();
let last=performance.now(),acc=0;
function loop(now){
  acc+=Math.min(100,now-last);last=now;
  while(acc>=1000/60){step();acc-=1000/60;}
  render();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
